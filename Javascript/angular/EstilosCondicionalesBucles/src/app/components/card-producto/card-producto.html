
@if(producto){
<article class="producto"[class.stockBajo]="producto.stock < 10">
    <h3>{{producto.nombre}}</h3>
    <div class="info">
        <p>Precio: {{producto.precio}}€</p>
        <p>Departamento: {{producto.departamento}}</p>
        <p>Stock: {{producto.stock}}</p>
    </div>
    @if(producto.oferta){
    <label>EN OFERTA</label>
    }
</article>
}
